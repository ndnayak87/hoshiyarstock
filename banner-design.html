<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navratri Banner - Hoshiyar Group</title>
    <style>
        /* Banner container - 4*6 ratio (width:height = 4:6 = 2:3) */
        .banner {
            width: 800px;      /* 4 inches at 200 PPI */
            height: 1200px;    /* 6 inches at 200 PPI */
            background-color: #ffffff;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px auto;
            position: relative;
        }

        /* Hindi text section */
        .hindi-text {
            font-size: 48px;
            font-weight: bold;
            color: #2d3436;
            text-align: center;
            padding: 40px 20px;
            line-height: 1.4;
            min-height: 300px; /* Ensure proper vertical spacing */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hindi-text p {
            margin: 0;
        }

        /* Company logo section */
        .logo-section {
            text-align: center;
            padding: 20px;
        }

        .logo-section img {
            max-width: 200px;
            max-height: 100px;
            height: auto;
        }

        .present-by {
            font-size: 24px;
            color: #007bff;
            font-weight: bold;
            margin-top: 10px;
            display: block;
        }

        /* Decorative elements */
        .divider {
            width: 80%;
            height: 2px;
            background-color: #e2e6ea;
            margin: 20px auto;
        }
    </style>
</head>
<body>

<div class="banner">
    <!-- Hindi Text Section -->
    <div class="hindi-text">
        <p>नव युवक दुर्गautsव समिति की तरफ से नवरात्रि की हार्दिक शुभकामनाएं...</p>
    </div>

    <!-- Company Logo & "Present By" Section -->
    <div class="logo-section">
        <!-- Replace with your actual logo image -->
        <img src="https://via.placeholder.com/300x100?text=Hoshiyar+Group+Logo" alt="Company Logo">
        <div class="present-by">present by ..hoshiyargroup</div>
    </div>

    <!-- Optional decorative line -->
    <div class="divider"></div>
</div>

</body>
</html>
